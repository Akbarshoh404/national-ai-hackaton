services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bozorpilot
      POSTGRES_PASSWORD: bozorpilot
      POSTGRES_DB: bozorpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bozorpilot"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bozorpilot:bozorpilot@db:5432/bozorpilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
